<pre id="engine">
      ▲
   ▲     ▲

● →         ← ●
</pre>

<script>
// Dreiecke rotieren (ASCII)
let angle = 0;

// Driftpunkte
let left = 0;
let right = 20;

function render() {
  const tri1 = "▲";
  const tri2 = "▲";
  const tri3 = "▲";

  // einfache Rotation (ASCII-Shift)
  const rot = angle % 3;
  const tris = [
    ["      ▲", "   ▲     ▲"],
    ["      ▲", "   ▲     ▲"],
    ["      ▲", "   ▲     ▲"]
  ][rot];

  // Drift
  left += 1;
  right -= 1;

  // Treffpunkt
  let meet = "";
  if (left >= right) {
    meet = "\n     ●   ← neuer Treffpunkt";
  }

  document.getElementById("engine").textContent =
    tris[0] + "\n" +
    tris[1] + "\n\n" +
    " ".repeat(left) + "● →" + " ".repeat(right - left) + "← ●" +
    meet;

  angle++;
  requestAnimationFrame(render);
}

render();
</script>
